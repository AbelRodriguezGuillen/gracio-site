<!-- title: Open in Gracio -->
<!-- description: Opens a message from Gracio in the app. -->
<!-- robots: noindex, nofollow -->
<main class="wrap doc shared">
<h1>Open in Gracio</h1>
<p class="date" id="meta" aria-live="polite">Opening Gracio…</p>

<div class="box">
  <p id="has"><a class="button" id="openLink" href="gracio://inbox">Open in Gracio</a></p>
  <p>If nothing happens, open this email on the iPhone where you use Gracio, or open the app and go to your Inbox.</p>
  <p>Don't have Gracio yet? It's coming soon to the App Store in New Jersey and Manhattan.</p>
</div>
</main>
<script src="/assets/open.js?v={{js:open}}"></script>
