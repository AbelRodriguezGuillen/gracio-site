<!-- title: A business on Gracio -->
<!-- description: A business shared from Gracio: its score for how people were treated, and its reviews. -->
<!-- robots: noindex, nofollow -->
<main class="wrap doc shared biz">
<h1 id="name">A business on Gracio</h1>
<p class="date" id="meta" aria-live="polite">Opening…</p>

<div id="body" hidden>
  <section class="score-card" id="scoreCard" aria-label="Gracio score">
    <p class="score-label">Gracio score · how people were treated</p>
    <div class="score-row" id="scoreRow">
      <p class="score-big"><span id="scoreNum"></span><span class="score-of"> / 5</span></p>
      <div>
        <div class="ties" id="scoreTies" aria-hidden="true"></div>
        <p class="score-word" id="scoreWord"></p>
      </div>
    </div>
    <p class="score-meta" id="scoreMeta"></p>
  </section>

  <section class="biz-card" id="photosCard" hidden>
    <h2 class="card-label" id="photosTitle">Photos</h2>
    <div class="photo-strip" id="photoStrip"></div>
  </section>

  <section class="biz-card" id="detailsCard" hidden>
    <h2 class="card-label">The details</h2>
    <ul class="details" id="details"></ul>
  </section>

  <div class="biz-actions">
    <a class="button" id="openLink" href="#">Open in Gracio</a>
    <a class="button button-line" href="/get.html">Get Gracio for iPhone</a>
    <a class="directions" id="directions" href="#" hidden>Directions</a>
  </div>

  <section class="reviews" aria-labelledby="reviewsTitle">
    <h2 id="reviewsTitle">Reviews</h2>
    <div id="reviewTools" hidden>
      <label class="search">
        <span class="sr">Search reviews</span>
        <input type="search" id="q" placeholder="Search reviews" autocomplete="off">
      </label>
      <div class="pickers">
        <label>Sort
          <select id="sort">
            <option value="new">Newest first</option>
            <option value="old">Oldest first</option>
            <option value="high">Most bow ties</option>
            <option value="low">Fewest bow ties</option>
            <option value="helpful">Most helpful</option>
          </select>
        </label>
        <label>Bow ties
          <select id="stars">
            <option value="0">All</option>
            <option value="5">5 · Gracious</option>
            <option value="4">4 · Polite</option>
            <option value="3">3 · Fine</option>
            <option value="2">2 · Cold</option>
            <option value="1">1 · Rude</option>
          </select>
        </label>
      </div>
    </div>
    <p class="review-count" id="reviewCount" aria-live="polite"></p>
    <ul class="review-list" id="reviewList"></ul>
    <button type="button" class="more" id="more" hidden>Show 10 more reviews</button>
  </section>
</div>
</main>
<script src="/assets/p.js?v={{js:p}}"></script>
